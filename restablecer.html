<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>PawID - Nueva contraseña</title>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <link rel="stylesheet" href="cuenta.css">
</head>
<body>
    <div class="top-logo">🐾 PawID</div>
    <div class="card">
        <h1 id="titulo">Verificando enlace…</h1>
        <p id="texto">Espera un momento.</p>

        <form id="form" class="oculto" autocomplete="off">
            <label for="pass">Nueva contraseña</label>
            <input id="pass" type="password" autocomplete="new-password" required>
            <ul class="reqs">
                <li data-r="len">Mínimo 10 caracteres</li>
                <li data-r="may">Al menos una mayúscula (A-Z)</li>
                <li data-r="min">Al menos una minúscula (a-z)</li>
                <li data-r="num">Al menos un número (0-9)</li>
                <li data-r="esp">Al menos un carácter especial</li>
            </ul>
            <label for="pass2">Confirmar contraseña</label>
            <input id="pass2" type="password" autocomplete="new-password" required>
            <button id="btn" type="submit">Cambiar contraseña</button>
        </form>
        <div id="msg" class="msg"></div>
    </div>
<script>
    // Mismos requisitos que la app (pantalla de registro).
    const reglas = {
        len: p => p.length >= 10,
        may: p => /[A-Z]/.test(p),
        min: p => /[a-z]/.test(p),
        num: p => /[0-9]/.test(p),
        esp: p => /[!@#%&*.,;:_=+?\-\/\\()\[\]{}^~|<>$]/.test(p)
    };
    const $ = id => document.getElementById(id);
    let token = null;

    function mensaje(tipo, texto) {
        $('msg').className = 'msg ' + tipo;
        $('msg').textContent = texto;
    }

    $('pass').addEventListener('input', () => {
        const p = $('pass').value;
        document.querySelectorAll('.reqs li').forEach(li =>
            li.classList.toggle('ok', reglas[li.dataset.r](p)));
    });

    $('form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const p = $('pass').value;
        if (!Object.values(reglas).every(r => r(p))) {
            return mensaje('error', 'La contraseña no cumple todos los requisitos.');
        }
        if (p !== $('pass2').value) {
            return mensaje('error', 'Las contraseñas no coinciden.');
        }
        $('btn').disabled = true;
        try {
            await PawAuth.cambiarPassword(token, p);
            await PawAuth.cerrarSesion(token);
            $('form').classList.add('oculto');
            $('titulo').textContent = '¡Contraseña actualizada!';
            $('texto').textContent = 'Vuelve a la app PawID e inicia sesión con tu nueva contraseña.';
            $('msg').className = 'msg';
        } catch (e) {
            mensaje('error', e.message);
            $('btn').disabled = false;
        }
    });

    (async function () {
        try {
            const sesion = await PawAuth.verificar('recovery');
            token = sesion.access_token;
            $('titulo').textContent = 'Crea tu nueva contraseña';
            $('texto').textContent = 'Ingresa una contraseña segura para tu cuenta PawID.';
            $('form').classList.remove('oculto');
        } catch (e) {
            $('titulo').textContent = 'Enlace no válido';
            $('texto').textContent = e.message;
        }
    })();
</script>
</body>
</html>
