<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>PawID - Confirmar cuenta</title>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <link rel="stylesheet" href="cuenta.css">
</head>
<body>
    <div class="top-logo">🐾 PawID</div>
    <div class="card">
        <h1 id="titulo">Confirmando tu cuenta…</h1>
        <p id="texto">Espera un momento.</p>
    </div>
<script>
    (async function () {
        const titulo = document.getElementById('titulo');
        const texto = document.getElementById('texto');
        try {
            const sesion = await PawAuth.verificar('email');
            await PawAuth.cerrarSesion(sesion.access_token);
            titulo.textContent = '¡Cuenta confirmada!';
            texto.textContent = 'Ya puedes volver a la app PawID e iniciar sesión con tu correo y contraseña.';
        } catch (e) {
            titulo.textContent = 'No se pudo confirmar';
            texto.textContent = e.message;
        }
    })();
</script>
</body>
</html>
