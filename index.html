<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawID - Ficha de Mascota</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #F5F5F0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }
        .top-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .top-logo span { font-size: 22px; font-weight: 700; color: #007777; }
        .main-card {
            background: #FEFEFE;
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            border: 2.5px solid #00A3A3;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,119,119,0.12);
        }
        .header {
            background-color: #007777;
            padding: 20px;
            color: #FEFEFE;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h2 { font-size: 22px; font-weight: 700; }
        .header small { color: #E0F7FA; font-size: 13px; }
        .pet-img {
            width: 64px; height: 64px;
            border-radius: 50%;
            border: 2.5px solid white;
            object-fit: cover;
        }
        .pet-initial {
            width: 64px; height: 64px;
            background: #E0F7FA;
            border-radius: 50%;
            border: 2px solid white;
            color: #007777;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
        }
        .section-title {
            background-color: #00A3A3;
            color: white;
            padding: 10px 16px;
            font-weight: 700;
            font-size: 14px;
        }
        .section-content {
            background-color: #F5F5F0;
            padding: 14px 16px;
            border-bottom: 1px solid #E0F7FA;
        }
        .row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .row:last-child { margin-bottom: 0; }
        .label { color: #666; }
        .value { color: #1A1A3A; font-weight: 700; text-align: right; word-break: break-word; }
        .desc {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #E0F7FA;
            font-size: 14px;
        }
        .desc-text {
            color: #1A1A3A;
            margin-top: 4px;
            line-height: 1.4;
            white-space: pre-line;
            word-break: break-word;
        }
        .card-footer {
            background: #E0F7FA;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px 12px;
            font-size: 11px;
            color: #007777;
            word-break: break-all;
        }
        .btn-group {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 26px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-download { background: #00A3A3; color: white; }
        .btn-download:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="top-logo"><span>🐾 PawID</span></div>

    <div class="main-card" id="content"></div>
    <div class="btn-group">
        <button class="btn btn-download" id="downloadBtn" onclick="descargarPDF()">⬇️ DESCARGAR PDF</button>
    </div>

<script>
    // Limpia valores: si viene vacío, null, "undefined" o solo espacios, usa el fallback
    function limpiar(valor, fallback) {
        if (valor === null || valor === undefined) return fallback;
        const v = String(valor).trim();
        if (v === '' || v === 'null' || v === 'undefined') return fallback;
        return v;
    }

    // Escapa HTML: los datos vienen de la URL y no deben interpretarse como código.
    function esc(valor) {
        return String(valor).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    // "8.5" -> "8.5 kg"; vacío o inválido -> "No informado"
    function pesoLegible(valor) {
        const n = parseFloat(String(valor).replace(',', '.'));
        if (!isFinite(n) || n <= 0) return 'No informado';
        return parseFloat(n.toFixed(2)) + ' kg';
    }

    // ── Configuración pública de Supabase ─────────────────────────────────
    // La clave anon es pública por diseño: solo permite ejecutar la función
    // `ficha_publica`, que devuelve los datos públicos de la mascota.
    const SUPABASE_URL = 'https://ujsokaxksqwqojvctvtx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqc29rYXhrc3F3cW9qdmN0dnR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NDczMjYsImV4cCI6MjA5NjUyMzMyNn0.-Z2vF2M6KuBgv0xikU603xgJV2SegB3P0a8CNlTL9IM';

    const params = new URLSearchParams(window.location.search);
    const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    let pet = null;

    // "2020-05-14" -> "14/05/2020"
    function fechaLegible(iso) {
        const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
        return m ? `${m[3]}/${m[2]}/${m[1]}` : '---';
    }

    // Edad en años a partir de "yyyy-MM-dd"
    function edad(iso) {
        const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
        if (!m) return 'N/A';
        const hoy = new Date();
        let a = hoy.getFullYear() - +m[1];
        if (hoy.getMonth() + 1 < +m[2] || (hoy.getMonth() + 1 === +m[2] && hoy.getDate() < +m[3])) a--;
        return a < 0 ? 'N/A' : `${a} año${a === 1 ? '' : 's'}`;
    }

    function soloHttps(url) {
        return url && /^https:\/\//i.test(url) ? url : null;
    }

    // Pide a Supabase solo los datos públicos de la mascota (por UUID).
    async function cargarFicha(id) {
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/rpc/ficha_publica`, {
            method: 'POST',
            headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ p_id: id })
        });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const filas = await resp.json();
        if (!filas.length) return null;
        const m = filas[0];
        return {
            n:    limpiar(m.nombre, '---'),
            e:    limpiar(m.especie, '---'),
            r:    limpiar(m.raza, '---'),
            f:    fechaLegible(m.fecha_nacimiento),
            ed:   edad(m.fecha_nacimiento),
            d:    limpiar(m.dueno_nombre, '---'),
            t:    limpiar(m.dueno_telefono, '---'),
            id:   m.id,
            peso: pesoLegible(limpiar(m.peso_kg, '')),
            v:    limpiar(m.vacunas, 'No informado'),
            ds:   limpiar(m.descripcion, '').slice(0, 300),
            img:  soloHttps(m.foto_path)
        };
    }

    // QR antiguos (antes de noviembre 2026) traían los datos en la URL.
    function fichaDesdeUrl() {
        return {
            n:   limpiar(params.get('n'),  '---'),
            e:   limpiar(params.get('e'),  '---'),
            r:   limpiar(params.get('r'),  '---'),
            f:   limpiar(params.get('f'),  '---'),
            ed:  limpiar(params.get('ed'), 'N/A'),
            d:   limpiar(params.get('d'),  '---'),
            t:   limpiar(params.get('t'),  '---'),
            id:  limpiar(params.get('id'), '---'),
            peso: pesoLegible(limpiar(params.get('p'), '')),
            v:    limpiar(params.get('v'), 'No informado'),
            ds:   limpiar(params.get('ds'), '').slice(0, 300),
            img:  soloHttps(params.get('img'))
        };
    }

    function mostrarMensaje(titulo, texto) {
        document.getElementById('content').innerHTML = `
            <div class="header"><div><h2>PawID</h2><small>${esc(titulo)}</small></div></div>
            <div class="section-content"><p class="desc-text">${esc(texto)}</p></div>`;
        document.getElementById('downloadBtn').style.display = 'none';
    }

    function mostrarFicha() {
        const inicial = Array.from(pet.n)[0].toUpperCase();

        const descHtml = pet.ds
            ? `<div class="desc">
                   <span class="label">Descripción</span>
                   <p class="desc-text">${esc(pet.ds)}</p>
               </div>`
            : '';

        document.getElementById('content').innerHTML = `
            <div class="header">
                <div><h2>PawID</h2><small>Ficha de Mascota</small></div>
                <div id="headerRight"></div>
            </div>
            <div class="section-title">Datos de la Mascota</div>
            <div class="section-content">
                <div class="row"><span class="label">Nombre</span><span class="value">${esc(pet.n)}</span></div>
                <div class="row"><span class="label">Especie</span><span class="value">${esc(pet.e)}</span></div>
                <div class="row"><span class="label">Raza</span><span class="value">${esc(pet.r)}</span></div>
                <div class="row"><span class="label">Fecha de nacimiento</span><span class="value">${esc(pet.f)}</span></div>
                <div class="row"><span class="label">Edad</span><span class="value">${esc(pet.ed)}</span></div>
                <div class="row"><span class="label">Peso</span><span class="value">${esc(pet.peso)}</span></div>
                <div class="row"><span class="label">Vacunas al día</span><span class="value">${esc(pet.v)}</span></div>
                ${descHtml}
            </div>
            <div class="section-title">Datos del Dueño</div>
            <div class="section-content">
                <div class="row"><span class="label">Nombre</span><span class="value">${esc(pet.d)}</span></div>
                <div class="row"><span class="label">Teléfono</span><span class="value">${esc(pet.t)}</span></div>
            </div>
            <div class="card-footer">
                <span>ID: ${esc(pet.id)}</span>
                <span>Generado por PawID</span>
            </div>
        `;

        // Foto de la mascota (o su inicial si no hay foto o no carga)
        (function mostrarFoto() {
            const cont = document.getElementById('headerRight');

            function mostrarInicial() {
                cont.innerHTML = '';
                const d = document.createElement('div');
                d.className = 'pet-initial';
                d.textContent = inicial;
                cont.appendChild(d);
            }

            if (!pet.img) { mostrarInicial(); return; }

            const im = new Image();
            im.className = 'pet-img';
            im.alt = pet.n;
            im.onerror = mostrarInicial;
            im.src = pet.img;
            cont.appendChild(im);
        })();
    }

    (async function iniciar() {
        const id = params.get('id');
        try {
            if (params.has('n')) {
                pet = fichaDesdeUrl();
            } else if (id && UUID_RE.test(id)) {
                mostrarMensaje('Cargando…', 'Buscando la ficha de la mascota.');
                pet = await cargarFicha(id);
            }
        } catch (err) {
            mostrarMensaje('Sin conexión', 'No se pudo cargar la ficha. Revisa tu conexión e intenta de nuevo.');
            return;
        }
        if (!pet) {
            mostrarMensaje('Ficha no encontrada', 'Este código QR no corresponde a una mascota registrada en PawID.');
            return;
        }
        document.getElementById('downloadBtn').style.display = '';
        mostrarFicha();
    })();

    // Recorta una imagen (URL o data URL) en un círculo, devuelve una
    // Promise<dataURL PNG>. Necesario porque jsPDF no soporta clip circular
    // nativo para addImage, y porque hay que esperar a que la imagen cargue.
    //
    // crossOrigin = 'anonymous' es indispensable: la foto viene de un dominio
    // distinto (Supabase Storage), y sin esto el canvas queda "contaminado"
    // (tainted) y toDataURL() falla silenciosamente por política CORS.
    function recortarCircular(url, size) {
        return new Promise((resolve, reject) => {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function() {
                try {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.clip();
                    ctx.drawImage(img, 0, 0, size, size);
                    ctx.restore();
                    resolve(canvas.toDataURL('image/png'));
                } catch (err) {
                    reject(err);
                }
            };
            img.onerror = reject;
            img.src = url;
        });
    }

    async function generarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: 'mm', format: 'a4' });
        const w = 210;

        const mascotaData = [
            ['Nombre', pet.n],
            ['Especie', pet.e],
            ['Raza', pet.r],
            ['Fecha de nacimiento', pet.f],
            ['Edad', pet.ed],
            ['Peso', pet.peso],
            ['Vacunas al día', pet.v],
        ];
        const duenoData = [['Nombre', pet.d], ['Teléfono', pet.t]];

        // La descripción puede ocupar varias líneas
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        const descLines = pet.ds ? doc.splitTextToSize(pet.ds, w - 40) : [];

        // ── Alturas calculadas según el contenido ──────────────────────────
        const lastRowBaseline = 69 + (mascotaData.length - 1) * 8;
        const descLabelY = lastRowBaseline + 8;
        const lastBaseline = descLines.length
            ? descLabelY + 6 + (descLines.length - 1) * 5
            : lastRowBaseline;
        const mascotaBottom = lastBaseline + 4;          // fin del recuadro de la mascota
        const duenoTitleY = mascotaBottom + 5;
        const duenoTop = duenoTitleY + 8;
        const duenoBottom = duenoTop + 9 + (duenoData.length - 1) * 8 + 5;
        const footerY = duenoBottom + 5;
        const borderH = footerY + 10 + 3 - 13;           // alto del borde exterior

        // Borde decorativo redondeado alrededor de toda la ficha
        doc.setDrawColor(0, 163, 163);
        doc.setLineWidth(0.8);
        doc.roundedRect(13, 13, w - 26, borderH, 6, 6, 'S');

        // Encabezado
        doc.setFillColor(0, 119, 119);
        doc.roundedRect(15, 15, w - 30, 30, 4, 4, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(18);
        doc.setFont('helvetica', 'bold');
        doc.text('PawID', 25, 28);
        doc.setFontSize(10);
        doc.setFont('helvetica', 'normal');
        doc.text('Ficha de Mascota', 25, 35);
        doc.setFillColor(224, 247, 250);
        doc.circle(w - 30, 30, 12, 'F');

        if (pet.img) {
            try {
                const circularImg = await recortarCircular(pet.img, 96);
                const cx = w - 30, cy = 30, radius = 12;
                doc.addImage(circularImg, 'PNG', cx - radius, cy - radius, radius * 2, radius * 2);
            } catch (err) {
                // Si la imagen no carga (sin internet, URL rota, CORS), usamos
                // la inicial como respaldo en vez de dejar el PDF roto.
                doc.setTextColor(0, 119, 119);
                doc.setFontSize(14);
                doc.setFont('helvetica', 'bold');
                doc.text(inicial, w - 33, 34);
            }
        } else {
            doc.setTextColor(0, 119, 119);
            doc.setFontSize(14);
            doc.setFont('helvetica', 'bold');
            doc.text(inicial, w - 33, 34);
        }

        // Datos de la mascota
        doc.setFillColor(0, 163, 163);
        doc.roundedRect(15, 52, w - 30, 8, 2, 2, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(11);
        doc.setFont('helvetica', 'bold');
        doc.text('Datos de la Mascota', 20, 58);
        doc.setFillColor(245, 245, 240);
        doc.rect(15, 60, w - 30, mascotaBottom - 60, 'F');

        mascotaData.forEach(([label, value], i) => {
            const y = 69 + i * 8;
            doc.setTextColor(102, 102, 102);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10);
            doc.text(label, 20, y);
            doc.setTextColor(26, 26, 58);
            doc.setFont('helvetica', 'bold');
            // Fuerza string seguro: evita el glifo raro cuando el valor viene vacío/null
            doc.text(String(value || '---'), 100, y);
        });

        if (descLines.length) {
            doc.setTextColor(102, 102, 102);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10);
            doc.text('Descripción', 20, descLabelY);
            doc.setTextColor(26, 26, 58);
            descLines.forEach((line, i) => {
                doc.text(line, 20, descLabelY + 6 + i * 5);
            });
        }

        // Datos del dueño
        doc.setFillColor(0, 163, 163);
        doc.roundedRect(15, duenoTitleY, w - 30, 8, 2, 2, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(11);
        doc.setFont('helvetica', 'bold');
        doc.text('Datos del Dueño', 20, duenoTitleY + 6);
        doc.setFillColor(245, 245, 240);
        doc.rect(15, duenoTop, w - 30, duenoBottom - duenoTop, 'F');

        duenoData.forEach(([label, value], i) => {
            const y = duenoTop + 9 + i * 8;
            doc.setTextColor(102, 102, 102);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10);
            doc.text(label, 20, y);
            doc.setTextColor(26, 26, 58);
            doc.setFont('helvetica', 'bold');
            doc.text(String(value || '---'), 100, y);
        });

        // Pie
        doc.setFillColor(224, 247, 250);
        doc.roundedRect(15, footerY, w - 30, 10, 3, 3, 'F');
        doc.setTextColor(0, 119, 119);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.text(`ID: ${pet.id}`, 20, footerY + 7);
        doc.text('Generado por PawID', w - 55, footerY + 7);

        return doc;
    }

    // Descargar PDF directamente
    async function descargarPDF() {
        if (!pet) return;
        const btn = document.getElementById('downloadBtn');
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '⏳ Generando...';

        try {
            const doc = await generarPDF();
            doc.save(`PawID_${pet.n}.pdf`);
        } catch (err) {
            alert('No se pudo generar el PDF. Intenta de nuevo.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }
</script>
</body>
</html>
